name: Android Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'aab'
        type: choice
        options:
          - aab
          - apk
  push:
    branches: [main]
    # Étiquette « android-build-* » : relance un build APK+AAB à la demande,
    # sans nouveau commit (parité avec le dépôt FR).
    tags:
      - 'android-build-*'
    paths-ignore:
      - '**.md'
      - '.gitignore'
      # Cloud Functions : déployées via Firebase CLI, pas embarquées dans l'app →
      # inutile de rebuilder l'app pour un changement serveur.
      - 'firebase/**'
      # Site web (numeline.com) : déployé par Vercel, pas embarqué dans l'app →
      # un changement purement site ne doit pas relancer un build d'app.
      - 'public/**'
      - 'blog/**'
      - 'docs/**'
      - 'vercel.json'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The AAB + APK build filled the runner disk ("No space left on device").
      # ubuntu-latest ships ~14 GB free; reclaim ~20-30 GB by removing large
      # toolchains this Android build never touches (.NET, GHC/Haskell, CodeQL,
      # Swift, cached Docker images). The Android SDK/NDK, Java and Node stay.
      - name: Free disk space
        run: |
          echo "Before:"; df -h /
          # Outils volumineux qu'un build Android ne touche jamais. Le SDK/NDK
          # Android, Java et Node sont evidemment conserves.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift \
            /usr/local/share/powershell \
            /usr/local/lib/heroku /opt/az /usr/share/miniconda \
            /usr/local/share/boost /usr/lib/google-cloud-sdk \
            /usr/local/graalvm /usr/local/share/chromium || true
          sudo docker image prune --all --force || true
          echo "After:"; df -h /

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # NOTE: `npx expo prebuild` is intentionally NOT run here. The android/
      # folder is committed to git and contains a custom signing config in
      # android/app/build.gradle that prebuild would wipe. If you change
      # app.json plugins or permissions, run `npx expo prebuild --platform
      # android` locally, re-apply the release signing block to build.gradle,
      # and commit the regenerated android/ tree.

      - name: Decode Keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Create google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > android/app/google-services.json

      # No .env needed: Vision/Claude go through Cloud Functions whose endpoints
      # live in app.json. Setting EXPO_PUBLIC_VISION_ENDPOINT to the old direct
      # Google API URL would now override that and break the Cloud Function call.

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # versionCode = BASE + numero de run GitHub. Strictement croissant et unique,
      # mais incremente de 1 par build au lieu de ~1 par seconde comme l'ancien
      # timestamp Unix : le Play Console signalait chaque release comme "nettement
      # superieure a la precedente", et a ce rythme la limite Android de
      # 2 100 000 000 aurait ete atteinte vers 2036.
      # BASE depasse le plus haut timestamp deja publie (~1 788 379 205), donc la
      # suite reste croissante malgre le changement de methode -- indispensable,
      # Google refusant tout versionCode inferieur a un code deja utilise.
      # Marge restante : 2 100 000 000 - BASE = 300 000 000 builds.
      # ATTENTION : si ce workflow est supprime puis recree, run_number repart a 1 ;
      # il faudrait alors augmenter VERSION_CODE_BASE d'autant.
      # versionName est synchronise depuis app.json (Android ignore app.json ici,
      # faute de prebuild, donc on patche android/app/build.gradle directement).
      - name: Set Android version (auto versionCode + sync versionName)
        env:
          VERSION_CODE_BASE: "1800000000"
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          VERSION_CODE=$((VERSION_CODE_BASE + RUN_NUMBER))
          VERSION_NAME=$(node -e "console.log(require('./app.json').expo.version)")
          echo "Android versionCode=$VERSION_CODE versionName=$VERSION_NAME"
          sed -i "s/versionCode [0-9]\+/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION_NAME\"/" android/app/build.gradle

      - name: Build AAB (Google Play)
        if: ${{ github.event_name == 'push' || github.event.inputs.build_type == 'aab' }}
        working-directory: android
        run: |
          ./gradlew bundleRelease --stacktrace \
            -PRELEASE_STORE_FILE=release.keystore \
            -PRELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }} \
            -PRELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }} \
            -PRELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}

      # L'APK est construit APRES l'AAB : si la place manque, c'est ici qu'elle
      # manque. On la mesure avant, pour que l'echec soit interpretable.
      - name: Disk space before APK
        if: ${{ github.event_name == 'push' || github.event.inputs.build_type == 'apk' }}
        run: df -h /

      - name: Build APK
        if: ${{ github.event_name == 'push' || github.event.inputs.build_type == 'apk' }}
        working-directory: android
        run: |
          ./gradlew assembleRelease --stacktrace \
            -PRELEASE_STORE_FILE=release.keystore \
            -PRELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }} \
            -PRELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }} \
            -PRELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Upload AAB
        if: ${{ github.event_name == 'push' || github.event.inputs.build_type == 'aab' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release.aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload APK
        if: ${{ github.event_name == 'push' || github.event.inputs.build_type == 'apk' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: android/app/build/outputs/apk/release/app-release.apk
